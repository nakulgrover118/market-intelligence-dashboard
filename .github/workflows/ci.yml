name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package with dev dependencies
        run: pip install -e ".[dev]"

      # The full test suite (150+ tests) runs entirely against synthetic/
      # mocked data via monkeypatched paths — no ingested market data, no
      # trained model artifacts, and no network access required. That's a
      # deliberate test-design property (see docs/roadmap.md), not
      # incidental: it's what makes this suite CI-runnable at all.
      - name: Run backend test suite
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Build
        run: npm run build
