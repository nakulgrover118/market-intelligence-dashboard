[project]
name = "market-intel-backend"
version = "0.1.0"
description = "Backend for Stock Market & Commodities Intelligence Dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "yfinance>=0.2.44",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "shap>=0.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
# Without this, setuptools' flat-layout auto-discovery sees both `app/`
# and `deploy_data/` (the git-tracked demo data snapshot — see
# docs/deployment.md) as candidate top-level packages and refuses to
# guess, breaking `pip install -e .` entirely. deploy_data is data, not
# code; only app/ should ever be installed as a package.
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
